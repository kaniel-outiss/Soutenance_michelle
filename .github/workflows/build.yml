name: Build APK + Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      # Clé de signature fixe : chaque version s'installe par-dessus la précédente
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: mkdir -p www && cp app.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      # versionCode croissant à chaque build
      - run: sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle && grep versionCode android/app/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Soutenance-Michelle.apk
      - uses: actions/upload-artifact@v4
        with: {name: apk, path: Soutenance-Michelle.apk}
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: copy app.html desktop\index.html
        shell: cmd
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/Soutenance-Michelle-Setup.exe
            desktop/dist/Soutenance-Michelle-portable.exe
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Soutenance Michelle — build ${{ github.run_number }}
          files: |
            out/Soutenance-Michelle.apk
            out/Soutenance-Michelle-Setup.exe
            out/Soutenance-Michelle-portable.exe
